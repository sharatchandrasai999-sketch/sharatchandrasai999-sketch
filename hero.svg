<svg xmlns="http://www.w3.org/2000/svg" width="720" height="216" viewBox="0 0 720 216" role="img" aria-label="Sharat Chandra Sai Boddu — AI Engineer">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79c0ff"/>
      <stop offset="0.55" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#79c0ff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="0.5" y="0.5" width="719" height="215" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect x="0.5" y="0.5" width="719" height="215" rx="14" fill="#0d1117"/>
    <rect x="-140" y="-30" width="280" height="276" fill="url(#sheen)">
      <animateTransform attributeName="transform" type="translate"
        values="-160 0; 900 0; 900 0" keyTimes="0; 0.55; 1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="40" y="78" font-size="42" font-weight="700" fill="#f0f6fc" letter-spacing="-0.5">Sharat Chandra Sai Boddu</text>
      <rect x="42" y="96" width="118" height="5" rx="2.5" fill="url(#accent)"/>
      <text x="40" y="134" font-size="18" fill="#79c0ff">AI Engineer · LLM evaluation · token-cost optimization</text>
      <text x="40" y="166" font-size="15" fill="#8b949e">I build tools that make large language models cheaper to run and easier to trust.</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="719" height="215" rx="14" fill="none" stroke="#30363d"/>
</svg>
